name: 手动批量删除文件

on:
  workflow_dispatch:
    inputs:
      file_box_1:
        description: '路径示例: folder/file.txt 或 sub/dir/ (支持空格分隔)'
        required: false
      file_box_2:
        description: '支持通配符: logs/*.log'
        required: false
      file_box_3:
        description: '输入框 3'
        required: false
      file_box_4:
        description: '输入框 4'
        required: false
      file_box_5:
        description: '输入框 5'
        required: false
      file_box_6:
        description: '输入框 6'
        required: false
      file_box_7:
        description: '输入框 7'
        required: false
      file_box_8:
        description: '输入框 8'
        required: false
      file_box_9:
        description: '输入框 9'
        required: false
      file_box_10:
        description: '输入框 10'
        required: false
      file_box_11:
        description: '输入框 11'
        required: false
      file_box_12:
        description: '输入框 12'
        required: false
      file_box_13:
        description: '输入框 13'
        required: false
      file_box_14:
        description: '输入框 14'
        required: false
      file_box_15:
        description: '输入框 15'
        required: false

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 执行删除操作
        run: |
          # 汇总 15 个输入框的内容并清理多余空格
          RAW_INPUTS="${{ github.event.inputs.file_box_1 }} ${{ github.event.inputs.file_box_2 }} ${{ github.event.inputs.file_box_3 }} ${{ github.event.inputs.file_box_4 }} ${{ github.event.inputs.file_box_5 }} ${{ github.event.inputs.file_box_6 }} ${{ github.event.inputs.file_box_7 }} ${{ github.event.inputs.file_box_8 }} ${{ github.event.inputs.file_box_9 }} ${{ github.event.inputs.file_box_10 }} ${{ github.event.inputs.file_box_11 }} ${{ github.event.inputs.file_box_12 }} ${{ github.event.inputs.file_box_13 }} ${{ github.event.inputs.file_box_14 }} ${{ github.event.inputs.file_box_15 }}"
          
          # 使用 shell 的 glob 扩展来处理路径和通配符
          for pattern in $RAW_INPUTS; do
            # 查找匹配的文件或目录
            for file in $pattern; do
              if [ -e "$file" ]; then
                git rm -rf "$file"
                echo "✅ 已标记删除: $file"
              else
                echo "⚠️ 跳过不存在的路径: $pattern"
              fi
            done
          done

      - name: 提交并推送更改
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.quotepath false
          
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "Actions: 批量删除文件/文件夹 [skip ci]"
            git push
          else
            echo "没有发现需要删除的有效文件。"
          fi
