name: 手动批量删除文件

on:
  workflow_dispatch:
    inputs:
      files_to_delete:
        description: '输入要删除的文件路径（多个文件用空格或换行分隔）'
        required: true
        default: 'file1.txt folder/file2.js'

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 执行删除操作
        run: |
          # 将输入的空格或换行符转换为数组并循环删除
          for file in ${{ github.event.inputs.files_to_delete }}; do
            if [ -f "$file" ] || [ -d "$file" ]; then
              git rm -r "$file"
              echo "已标记删除: $file"
            else
              echo "未找到文件: $file，跳过"
            fi
          done

      - name: 提交并推送更改
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.quotepath false  # 解决中文路径乱码显示
          git commit -m "Actions: 批量删除文件 [skip ci]" || echo "没有更改需要提交"
          git push
