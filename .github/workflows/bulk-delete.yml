name: 手动批量删除文件

on:
  workflow_dispatch:
    inputs:
      file_box_1:
        description: '输入框 1 (支持空格分隔多个文件)'
        required: false
      file_box_2:
        description: '输入框 2'
        required: false
      file_box_3:
        description: '输入框 3'
        required: false
      file_box_4:
        description: '输入框 4'
        required: false
      file_box_5:
        description: '输入框 5'
        required: false
      file_box_6:
        description: '输入框 6'
        required: false
      file_box_7:
        description: '输入框 7'
        required: false
      file_box_8:
        description: '输入框 8'
        required: false
      file_box_9:
        description: '输入框 9'
        required: false
      file_box_10:
        description: '输入框 10'
        required: false
      file_box_11:
        description: '输入框 11'
        required: false
      file_box_12:
        description: '输入框 12'
        required: false
      file_box_13:
        description: '输入框 13'
        required: false
      file_box_14:
        description: '输入框 14'
        required: false
      file_box_15:
        description: '输入框 15'
        required: false

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 执行删除操作
        run: |
          # 汇总所有输入框的内容
          ALL_FILES="${{ github.event.inputs.file_box_1 }} ${{ github.event.inputs.file_box_2 }} ${{ github.event.inputs.file_box_3 }} ${{ github.event.inputs.file_box_4 }} ${{ github.event.inputs.file_box_5 }} ${{ github.event.inputs.file_box_6 }} ${{ github.event.inputs.file_box_7 }} ${{ github.event.inputs.file_box_8 }} ${{ github.event.inputs.file_box_9 }} ${{ github.event.inputs.file_box_10 }} ${{ github.event.inputs.file_box_11 }} ${{ github.event.inputs.file_box_12 }} ${{ github.event.inputs.file_box_13 }} ${{ github.event.inputs.file_box_14 }} ${{ github.event.inputs.file_box_15 }}"
          
          # 循环处理每一个文件路径
          for file in $ALL_FILES; do
            if [ -e "$file" ]; then
              git rm -r "$file"
              echo "✅ 已标记删除: $file"
            else
              echo "⚠️ 未找到文件或目录: $file，跳过"
            fi
          done

      - name: 提交并推送更改
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.quotepath false
          
          # 检查是否有文件被标记删除，避免 commit 失败
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "Actions: 批量删除文件 [skip ci]"
            git push
          else
            echo "没有识别到有效的文件路径，无需提交。"
          fi
